# The automatic check of a submission: every entry for itself, and the entries among each other (references, ids).
# Copy to .github/workflows/validate.yml in each data repository (contents, contents-staging, contents-dev), then make
# the check `validate` required for the base branch (doc/einrichtung.md).
#
# The check itself lives in the editor's repository (core/scripts/validate-repo.ts); the data repository only runs it.
# Adjust EDITOR_REPO if the editor's repository is called differently. If it is private, give the check a token that may
# read it (a secret EDITOR_TOKEN, passed to `token:` of the second checkout).

name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EDITOR_REPO: hallo-schnackenburg/editor

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EDITOR_REPO }}
          path: .editor
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the check
        run: npm install --workspace @contents-editor/core --include-workspace-root
        working-directory: .editor
      - name: Check the entries
        run: npm run validate-repo --workspace @contents-editor/core -- "$GITHUB_WORKSPACE"
        working-directory: .editor

  # The index of the entries (a line per file, core/src/index-build.ts): the editor loads it instead of every file. It is made
  # from the valid state of the base branch only and kept as the single commit of the branch `index` (replaced every time, no history).
  index:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: index
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EDITOR_REPO }}
          path: .editor
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the tool
        run: npm install --workspace @contents-editor/core --include-workspace-root
        working-directory: .editor
      - name: Build the index
        run: |
          mkdir "$RUNNER_TEMP/index"
          npm run build-index --workspace @contents-editor/core -- "$GITHUB_WORKSPACE" "$GITHUB_SHA" "$RUNNER_TEMP/index/index.json"
        working-directory: .editor
      - name: Publish the index
        working-directory: ${{ runner.temp }}/index
        run: |
          git init --quiet --initial-branch=index
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          git commit --quiet --message "Index of $GITHUB_SHA"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" index
