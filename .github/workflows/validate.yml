# The automatic check of the data repositories (contents, contents-staging, contents-dev, the archive repositories): every entry for itself,
# the entries among each other (references, ids), and on pushes to the base branch the index and the bundle for the editor.
# A reusable workflow: the data repositories call it with templates/validate.yml and need no change when this one changes.
#
# The check itself lives in core/scripts/validate-repo.ts. Adjust EDITOR_REPO if this repository is called differently. If it is private,
# give the checks a token that may read it (a secret EDITOR_TOKEN, passed to `token:` of the second checkout).

name: validate

on:
  workflow_call:

env:
  EDITOR_REPO: hallo-schnackenburg/editor

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EDITOR_REPO }}
          path: .editor
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the check
        run: npm install --workspace @editor/core --include-workspace-root
        working-directory: .editor
      - name: Check the entries
        run: npm run validate-repo --workspace @editor/core -- "$GITHUB_WORKSPACE"
        working-directory: .editor

  # The index of the entries (a line per file, core/src/index-build.ts) and a bundle of all their texts: the editor loads the index instead of every file, and the bundle once. It is made
  # from the valid state of the base branch only and kept as the single commit of the branch `index` (replaced every time, no history).
  index:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: index
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EDITOR_REPO }}
          path: .editor
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the tool
        run: npm install --workspace @editor/core --include-workspace-root
        working-directory: .editor
      - name: Build the index
        run: |
          mkdir "$RUNNER_TEMP/index"
          npm run build-index --workspace @editor/core -- "$GITHUB_WORKSPACE" "$GITHUB_SHA" "$RUNNER_TEMP/index"
        working-directory: .editor
      - name: Publish the index
        working-directory: ${{ runner.temp }}/index
        run: |
          git init --quiet --initial-branch=index
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json entries.ndjson.gz
          git commit --quiet --message "Index of $GITHUB_SHA"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" index
